<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smooth Micro iOS Player</title>
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-base: transparent;
            --bg-surface: rgba(252, 248, 236, var(--glass-opacity, 0.85));
            --bg-hover: rgba(245, 238, 219, var(--glass-opacity, 0.85));
            --border-color: rgba(230, 210, 150, 0.4);
            --accent: #e5b83b;
            --accent-hover: #d4a72d;
            --text-main: #2c2c2e;
            --text-muted: #8e8e93;
            --radius: 14px;
            --shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
            --transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
            --glass-blur: 16px;
            --glass-opacity: 0.85;
            --glow-opacity: 0.15;
        }

        [data-theme="dark"] {
            --bg-base: transparent;
            --bg-surface: rgba(40, 37, 28, var(--glass-opacity, 0.85));
            --bg-hover: rgba(54, 50, 38, var(--glass-opacity, 0.85));
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #f5f5f7;
            --text-muted: #98989d;
            --shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
        }

        body[data-color="amber"] {
            --accent: #e5b83b; --accent-hover: #d4a72d;
            --bg-surface: rgba(252, 248, 236, var(--glass-opacity, 0.85));
            --bg-hover: rgba(245, 238, 219, var(--glass-opacity, 0.85));
            --border-color: rgba(230, 210, 150, 0.4);
        }
        [data-theme="dark"] body[data-color="amber"] {
            --bg-surface: rgba(38, 36, 26, var(--glass-opacity, 0.85));
            --bg-hover: rgba(50, 47, 34, var(--glass-opacity, 0.85));
            --border-color: rgba(229, 184, 59, 0.15);
        }

        body[data-color="sage"] {
            --accent: #7fa98b; --accent-hover: #6c9377;
            --bg-surface: rgba(240, 247, 242, var(--glass-opacity, 0.85));
            --bg-hover: rgba(228, 239, 231, var(--glass-opacity, 0.85));
            --border-color: rgba(160, 195, 170, 0.4);
        }
        [data-theme="dark"] body[data-color="sage"] {
            --bg-surface: rgba(28, 38, 31, var(--glass-opacity, 0.85));
            --bg-hover: rgba(36, 48, 40, var(--glass-opacity, 0.85));
            --border-color: rgba(127, 169, 139, 0.15);
        }

        body[data-color="rose"] {
            --accent: #d4838f; --accent-hover: #be717d;
            --bg-surface: rgba(252, 242, 244, var(--glass-opacity, 0.85));
            --bg-hover: rgba(247, 231, 234, var(--glass-opacity, 0.85));
            --border-color: rgba(225, 180, 188, 0.4);
        }
        [data-theme="dark"] body[data-color="rose"] {
            --bg-surface: rgba(42, 30, 33, var(--glass-opacity, 0.85));
            --bg-hover: rgba(54, 38, 42, var(--glass-opacity, 0.85));
            --border-color: rgba(212, 131, 143, 0.15);
        }

        body[data-color="lavender"] {
            --accent: #9d8ec4; --accent-hover: #8a7ab0;
            --bg-surface: rgba(246, 244, 250, var(--glass-opacity, 0.85));
            --bg-hover: rgba(238, 235, 245, var(--glass-opacity, 0.85));
            --border-color: rgba(195, 185, 220, 0.4);
        }
        [data-theme="dark"] body[data-color="lavender"] {
            --bg-surface: rgba(35, 32, 44, var(--glass-opacity, 0.85));
            --bg-hover: rgba(46, 42, 57, var(--glass-opacity, 0.85));
            --border-color: rgba(157, 142, 196, 0.15);
        }

        body[data-color="sky"] {
            --accent: #7ca9c9; --accent-hover: #6894b4;
            --bg-surface: rgba(242, 247, 251, var(--glass-opacity, 0.85));
            --bg-hover: rgba(231, 240, 247, var(--glass-opacity, 0.85));
            --border-color: rgba(170, 200, 220, 0.4);
        }
        [data-theme="dark"] body[data-color="sky"] {
            --bg-surface: rgba(28, 36, 43, var(--glass-opacity, 0.85));
            --bg-hover: rgba(36, 47, 56, var(--glass-opacity, 0.85));
            --border-color: rgba(124, 169, 201, 0.15);
        }

        body[data-color="peach"] {
            --accent: #e09f6e; --accent-hover: #cc8b5b;
            --bg-surface: rgba(253, 245, 240, var(--glass-opacity, 0.85));
            --bg-hover: rgba(249, 236, 228, var(--glass-opacity, 0.85));
            --border-color: rgba(230, 190, 165, 0.4);
        }
        [data-theme="dark"] body[data-color="peach"] {
            --bg-surface: rgba(43, 34, 28, var(--glass-opacity, 0.85));
            --bg-hover: rgba(56, 44, 36, var(--glass-opacity, 0.85));
            --border-color: rgba(224, 159, 110, 0.15);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            margin: 0;
            padding: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
            transition: background-color 0.5s ease;
        }

        .control-card, .info-bar, .player-wrapper, .controls-column, select, .theme-btn, .cinematic-btn, .glass-toggle-btn, .loop-badge-btn, .shortcut-btn, .notes-card, input[type="text"], textarea, .instruction-modal .shortcut-box, .notes-sidebar {
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1), background-color 0.4s ease, border-color 0.4s ease, color 0.4s ease, opacity 0.4s ease, filter 0.4s ease;
        }

        body.cinematic-mode .controls-column {
            opacity: 0.2;
            filter: blur(5px);
            pointer-events: auto;
        }

        body.cinematic-mode .controls-column:hover {
            opacity: 1;
            filter: blur(0);
        }

        body.cinematic-mode .player-wrapper {
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15), 0 0 15px var(--accent);
        }

        .dashboard {
            width: 100%;
            max-width: 760px;
            display: grid;
            grid-template-columns: 1.3fr 1fr;
            gap: 10px;
            align-items: stretch;
            transition: var(--transition);
        }

        .player-column {
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: relative;
        }

        .ambient-glow {
            position: absolute;
            inset: -2px;
            background: var(--accent);
            border-radius: calc(var(--radius) + 2px);
            filter: blur(14px);
            opacity: var(--glow-opacity);
            z-index: -1;
            transition: background 0.6s ease, opacity 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            pointer-events: none;
        }

        .controls-column {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2px;
            flex-wrap: nowrap;
            gap: 4px;
        }

        h1 {
            font-size: 13px;
            font-weight: 600;
            margin: 0;
            letter-spacing: -0.2px;
            transition: color 0.4s ease;
            white-space: nowrap;
        }

        .icon-top-btn {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 24px;
            height: 24px;
            border-radius: 7px;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            outline: none;
            padding: 0;
            flex-shrink: 0;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .icon-top-btn svg {
            width: 12px;
            height: 12px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .icon-top-btn:hover {
            background: var(--bg-hover);
            transform: scale(1.06);
            border-color: var(--accent);
        }

        .icon-top-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .header-controls {
            display: flex;
            gap: 3px;
            align-items: center;
            flex-wrap: nowrap;
        }

        select, .theme-btn {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            height: 24px;
            padding: 0 5px;
            border-radius: 7px;
            font-size: 9px;
            font-weight: 500;
            cursor: pointer;
            outline: none;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        select:hover, .theme-btn:hover {
            background: var(--bg-hover);
            border-color: var(--accent);
            transform: scale(1.02);
        }

        .glass-settings-panel {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-shadow: var(--shadow);
            font-size: 9px;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            margin: 0;
            border-width: 0;
            transition: max-height 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.3s ease, padding 0.4s ease, margin 0.4s ease, border-width 0.4s ease;
        }

        .glass-settings-panel.open {
            max-height: 220px;
            opacity: 1;
            padding: 8px;
            margin-bottom: 2px;
            border-width: 1px;
        }

        .slider-row {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .slider-row label {
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
            font-weight: 500;
            transition: color 0.4s ease;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .color-picker-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 4px;
            padding-top: 2px;
        }

        .color-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            cursor: pointer;
            border: 1px solid var(--border-color);
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .color-dot:hover {
            transform: scale(1.2);
        }

        .color-dot.active {
            transform: scale(1.25);
            box-shadow: 0 0 0 2px var(--bg-surface), 0 0 0 4px var(--accent);
        }

        .control-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-shadow: var(--shadow);
        }

        .control-row {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        input[type="text"] {
            flex: 1;
            min-width: 0;
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid transparent;
            color: var(--text-main);
            padding: 5px 8px;
            border-radius: 10px;
            font-size: 9px;
            outline: none;
        }

        [data-theme="dark"] input[type="text"] {
            background: rgba(0, 0, 0, 0.2);
        }

        input[type="text"]:focus {
            background: var(--bg-surface);
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(229, 184, 59, 0.2);
        }

        .action-btn, .file-label {
            background: var(--accent);
            color: #ffffff;
            border: none;
            padding: 5px 10px;
            border-radius: 10px;
            font-weight: 500;
            cursor: pointer;
            font-size: 9px;
            white-space: nowrap;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .action-btn:hover, .file-label:hover {
            background: var(--accent-hover);
            transform: translateY(-0.5px);
        }

        .action-btn:active, .file-label:active {
            transform: scale(0.96);
        }

        .action-btn.ab-active {
            background: #ff5252;
        }
        .action-btn.ab-active:hover {
            background: #ff1744;
        }

        input[type="file"] {
            display: none;
        }

        .notes-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            box-shadow: var(--shadow);
            position: relative;
        }

        .notes-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 9px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .notes-title-group {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .notes-logo-minimal {
            width: 13px;
            height: 13px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
        }

        .notes-logo-minimal svg {
            width: 11px;
            height: 11px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        textarea {
            width: 100%;
            height: 48px;
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid transparent;
            color: var(--text-main);
            padding: 5px 8px;
            border-radius: 8px;
            font-size: 9px;
            resize: none;
            box-sizing: border-box;
            outline: none;
            font-family: inherit;
        }

        [data-theme="dark"] textarea {
            background: rgba(0, 0, 0, 0.2);
        }

        textarea:focus {
            background: var(--bg-surface);
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(229, 184, 59, 0.2);
        }

        .notes-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .notes-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 3px 6px;
            border-radius: 6px;
            font-size: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .notes-btn:hover {
            background: var(--bg-hover);
            color: var(--text-main);
            border-color: var(--accent);
        }

        .notes-sidebar-container {
            position: relative;
        }

        .notes-sidebar {
            position: absolute;
            top: 0;
            right: -145px;
            width: 135px;
            height: 100%;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 6px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 4px;
            opacity: 0;
            pointer-events: none;
            transform: translateX(-10px);
            z-index: 20;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            box-sizing: border-box;
        }

        .notes-sidebar.open {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(0);
        }

        .notes-sidebar-header {
            font-size: 8px;
            font-weight: 600;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 3px;
        }

        .notes-search-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 3px 5px;
            border-radius: 5px;
            font-size: 8px;
            outline: none;
            box-sizing: border-box;
            margin-bottom: 2px;
        }
        [data-theme="dark"] .notes-search-input {
            background: rgba(0, 0, 0, 0.2);
        }
        .notes-search-input:focus {
            border-color: var(--accent);
        }

        .notes-sidebar-list {
            display: flex;
            flex-direction: column;
            gap: 3px;
            overflow-y: auto;
            max-height: 62px;
            font-size: 8px;
        }

        .sidebar-note-item {
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid transparent;
            padding: 3px 5px;
            border-radius: 5px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-main);
            transition: all 0.2s ease;
        }

        [data-theme="dark"] .sidebar-note-item {
            background: rgba(0, 0, 0, 0.15);
        }

        .sidebar-note-item:hover {
            background: var(--bg-hover);
            border-color: var(--accent);
        }

        .player-wrapper {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow);
            position: relative;
        }

        video {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            outline: none;
        }

        .video-info {
            padding: 6px 10px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border-color 0.4s ease;
        }

        .video-title {
            font-size: 9px;
            font-weight: 500;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            transition: color 0.4s ease;
        }

        .fullscreen-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 9px;
            font-weight: 500;
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .fullscreen-btn:hover {
            background: var(--bg-hover);
            color: var(--text-main);
        }

        .shortcut-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .shortcut-modal.open {
            opacity: 1;
            pointer-events: auto;
        }

        .shortcut-box {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 16px;
            width: 320px;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .shortcut-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            font-weight: 600;
        }

        .shortcut-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 9px;
        }

        .shortcut-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-muted);
        }

        .shortcut-item kbd {
            background: var(--bg-hover);
            border: 1px solid var(--border-color);
            padding: 2px 5px;
            border-radius: 4px;
            font-family: inherit;
            color: var(--text-main);
            font-weight: 600;
        }

        body.fullscreen-mode {
            padding: 0;
            background-color: #000;
        }

        body.fullscreen-mode .dashboard {
            display: flex;
            max-width: 100vw;
            height: 100vh;
            width: 100vw;
            gap: 0;
            position: relative;
        }

        body.fullscreen-mode .player-column {
            width: 100vw;
            height: 100vh;
        }

        body.fullscreen-mode .player-wrapper {
            border: none;
            border-radius: 0;
            box-shadow: none;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        body.fullscreen-mode video {
            width: 100vw;
            height: 100vh;
            aspect-ratio: unset;
            object-fit: contain;
            border-radius: 0;
            border: none;
            background: #000;
        }

        body.fullscreen-mode .ambient-glow {
            opacity: calc(var(--glow-opacity) * 0.5);
        }

        body.fullscreen-mode .controls-column {
            position: fixed;
            top: 16px;
            right: 16px;
            width: 320px;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transform: translateX(15px);
            transition: opacity 0.4s cubic-bezier(0.25, 1, 0.5, 1), transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), filter 0.4s ease;
        }

        body.fullscreen-mode .player-wrapper .video-info {
            display: none;
        }

        body.fullscreen-mode.show-controls .controls-column {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(0);
        }

        @media (max-width: 600px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
            body.fullscreen-mode .controls-column {
                width: calc(100vw - 32px);
                right: 16px;
            }
        }
    </style>
</head>
<body data-color="amber">

    <div class="dashboard">
        <!-- Left Column: Player -->
        <div class="player-column" id="playerColumn">
            <div class="ambient-glow" id="ambientGlow"></div>
            <div class="player-wrapper" id="playerWrapper">
                <video id="mainVideoPlayer" crossorigin="anonymous" controls playsinline></video>
                <div class="video-info">
                    <div class="video-title" id="currentVideoTitle">No video</div>
                    <button class="fullscreen-btn" id="expandBtn">Expand</button>
                </div>
            </div>
        </div>

        <!-- Right Column: Controls, Settings, Notes & Info -->
        <div class="controls-column" id="controlsColumn">
            <div class="header-row">
                <h1 id="appTitle">Player</h1>
                <div class="header-controls">
                    <!-- Minimalist SVG Icons -->

        function updateUI() {
            const lang = langSelect.value;
            const t = translations[lang] || translations.en;
            
            document.getElementById('appTitle').textContent = t.title;
            loadUrlBtn.textContent = t.load;
            videoUrlInput.placeholder = t.urlPlaceholder;
            document.getElementById('labelBrowse').childNodes[0].nodeValue = t.file + " ";
            expandBtn.textContent = t.expand;
            themeToggleBtn.textContent = t.theme;
            
            lblBlur.textContent = t.blur;
            lblOpacity.textContent = t.opacity;
            lblGlow.textContent = t.glow;
            lblScratchpad.textContent = t.scratchpad;
            lblRecentNotes.textContent = t.recentNotes;
            notesTextArea.placeholder = t.placeholderNotes;
            insertTimestampBtn.textContent = t.timeBtn;
            toggleSidebarBtn.textContent = t.recentBtn;
            saveNoteBtn.textContent = t.saveBtn;
            clearNotesBtn.textContent = t.clear;
            clearLoadedNoteBtn.textContent = t.deleteNoteBtn;
            downloadNotesBtn.textContent = t.download;
            noteSearchInput.placeholder = t.searchPlaceholder;

            if (loopPointA === null) setABtn.textContent = t.setA;
            if (loopPointB === null) setBBtn.textContent = t.setB;
            clearABtn.textContent = t.clearAB;

            lblKeyboardShortcuts.textContent = t.shortcutsTitle;
            scPlay.textContent = t.scPlay;
            scBack.textContent = t.scBack;
            scForward.textContent = t.scForward;
            scVol.textContent = t.scVol;
            scFull.textContent = t.scFull;
            scLoop.textContent = t.scLoop;
            scHelp.textContent = t.scHelp;

            instrModalTitle.textContent = t.instrTitle;
            instrModalText.innerHTML = t.instrText;

            if (activeSourceType === 'none') videoTitle.textContent = t.none;
            else if (activeSourceType === 'custom') videoTitle.textContent = t.custom;

            renderSidebarList(noteSearchInput.value);
        }

        langSelect.onchange = updateUI;
        themeToggleBtn.onclick = () => {
            htmlElement.setAttribute('data-theme', htmlElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
        };

        cinematicToggleBtn.onclick = () => {
            document.body.classList.toggle('cinematic-mode');
            cinematicToggleBtn.classList.toggle('active');
        };

        glassToggleBtn.onclick = () => {
            glassSettingsPanel.classList.toggle('open');
            glassToggleBtn.classList.toggle('active');
        };

        loopBadgeBtn.onclick = () => {
            videoPlayer.loop = !videoPlayer.loop;
            if (videoPlayer.loop) {
                loopBadgeBtn.classList.add('active');
            } else {
                loopBadgeBtn.classList.remove('active');
            }
        };

        shortcutHelpBtn.onclick = () => shortcutModal.classList.add('open');
        closeShortcutModal.onclick = () => shortcutModal.classList.remove('open');
        shortcutModal.onclick = (e) => {
            if (e.target === shortcutModal) shortcutModal.classList.remove('open');
        };

        instructionHelpBtn.onclick = () => instructionModal.classList.add('open');
        closeInstructionModal.onclick = () => instructionModal.classList.remove('open');
        instructionModal.onclick = (e) => {
            if (e.target === instructionModal) instructionModal.classList.remove('open');
        };

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        // A-B Repeat Logic Handlers
        setABtn.onclick = () => {
            const lang = langSelect.value;
            const t = translations[lang] || translations.en;
            loopPointA = videoPlayer.currentTime;
            setABtn.textContent = `A: ${formatTime(loopPointA)}`;
            checkABStatus();
        };

        setBBtn.onclick = () => {
            const lang = langSelect.value;
            const t = translations[lang] || translations.en;
            loopPointB = videoPlayer.currentTime;
            setBBtn.textContent = `B: ${formatTime(loopPointB)}`;
            checkABStatus();
        };

        clearABtn.onclick = () => {
            const lang = langSelect.value;
            const t = translations[lang] || translations.en;
            loopPointA = null;
            loopPointB = null;
            setABtn.textContent = t.setA;
            setBBtn.textContent = t.setB;
            setABtn.classList.remove('ab-active');
            setBBtn.classList.remove('ab-active');
        };

        function checkABStatus() {
            if (loopPointA !== null) setABtn.classList.add('ab-active');
            else setABtn.classList.remove('ab-active');

            if (loopPointB !== null) setBBtn.classList.add('ab-active');
            else setBBtn.classList.remove('ab-active');
        }

        videoPlayer.ontimeupdate = () => {
            if (loopPointA !== null && loopPointB !== null && loopPointB > loopPointA) {
                if (videoPlayer.currentTime >= loopPointB) {
                    videoPlayer.currentTime = loopPointA;
                }
            }
        };

        function renderSidebarList(filterKeyword = '') {
            const lang = langSelect.value;
            const t = translations[lang] || translations.en;

            notesSidebarList.innerHTML = '';
            const keyword = filterKeyword.toLowerCase().trim();

            const filteredEntries = savedNotesList
                .map((noteText, originalIndex) => ({ noteText, originalIndex }))
                .filter(item => item.noteText.toLowerCase().includes(keyword));

            if (filteredEntries.length === 0) {
                const emptyMsg = document.createElement('div');
                emptyMsg.style.cssText = 'padding: 6px; color: var(--text-muted); font-size: 8px; text-align: center;';
                emptyMsg.textContent = savedNotesList.length === 0 ? t.noSavedNotes : t.noMatchingNotes;
                notesSidebarList.appendChild(emptyMsg);
                return;
            }

            [...filteredEntries].reverse().forEach((item) => {
                const elem = document.createElement('div');
                elem.className = 'sidebar-note-item';
                elem.title = item.noteText;
                elem.textContent = item.noteText;
                
                if (activeNoteIndex === item.originalIndex) {
                    elem.style.borderColor = 'var(--accent)';
                    elem.style.fontWeight = '600';
                }

                elem.onclick = () => {
                    notesTextArea.value = item.noteText;
                    activeNoteIndex = item.originalIndex;
                    notesSidebar.classList.remove('open');
                    renderSidebarList(noteSearchInput.value);
                };
                notesSidebarList.appendChild(elem);
            });
        }

        saveNoteBtn.onclick = () => {
            const lang = langSelect.value;
            const t = translations[lang] || translations.en;

            const currentText = notesTextArea.value.trim();
            if (!currentText) return;

            if (activeNoteIndex !== null) {
                savedNotesList[activeNoteIndex] = currentText;
            } else {
                savedNotesList.push(currentText);
                activeNoteIndex = savedNotesList.length - 1;
            }

            localStorage.setItem('player_saved_notes_list', JSON.stringify(savedNotesList));
            renderSidebarList(noteSearchInput.value);
            alert(t.savedAlert);
        };

        noteSearchInput.oninput = (e) => {
            renderSidebarList(e.target.value);
        };

        toggleSidebarBtn.onclick = () => {
            noteSearchInput.value = '';
            renderSidebarList();
            notesSidebar.classList.toggle('open');
            if (notesSidebar.classList.contains('open')) {
                noteSearchInput.focus();
            }
        };

        closeSidebarBtn.onclick = () => {
            notesSidebar.classList.remove('open');
        };

        insertTimestampBtn.onclick = () => {
            const currentTime = formatTime(videoPlayer.currentTime || 0);
            const timestampText = `[${currentTime}] `;
            const start = notesTextArea.selectionStart;
            const end = notesTextArea.selectionEnd;
            const val = notesTextArea.value;
            notesTextArea.value = val.substring(0, start) + timestampText + val.substring(end);
            notesTextArea.selectionStart = notesTextArea.selectionEnd = start + timestampText.length;
            notesTextArea.focus();
        };

        clearNotesBtn.onclick = () => {
            notesTextArea.value = '';
            activeNoteIndex = null;
            renderSidebarList(noteSearchInput.value);
        };

        clearLoadedNoteBtn.onclick = () => {
            const lang = langSelect.value;
            const t = translations[lang] || translations.en;

            if (activeNoteIndex === null) {
                alert(t.noNoteLoadedAlert);
                return;
            }
            if (confirm(t.confirmDelete)) {
                savedNotesList.splice(activeNoteIndex, 1);
                localStorage.setItem('player_saved_notes_list', JSON.stringify(savedNotesList));
                notesTextArea.value = '';
                activeNoteIndex = null;
                renderSidebarList(noteSearchInput.value);
            }
        };

        downloadNotesBtn.onclick = () => {
            const text = notesTextArea.value;
            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'player-notes.txt';
            a.click();
            URL.revokeObjectURL(url);
        };

        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

            const key = e.key.toLowerCase();
            if (e.key === '?' || key === '/') {
                e.preventDefault();
                shortcutModal.classList.toggle('open');
                return;
            }

            if (key === ' ' || key === 'k') {
                e.preventDefault();
                if (videoPlayer.paused) videoPlayer.play();
                else videoPlayer.pause();
            } else if (key === 'j' || e.key === 'ArrowLeft') {
                e.preventDefault();
                videoPlayer.currentTime = Math.max(0, videoPlayer.currentTime - 5);
            } else if (key === 'l' || e.key === 'ArrowRight') {
                e.preventDefault();
                videoPlayer.currentTime = Math.min(videoPlayer.duration || 0, videoPlayer.currentTime + 5);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                videoPlayer.volume = Math.min(1, videoPlayer.volume + 0.1);
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                videoPlayer.volume = Math.max(0, videoPlayer.volume - 0.1);
            } else if (key === 'f') {
                e.preventDefault();
                toggleFullscreen();
            } else if (key === 'r') {
                e.preventDefault();
                loopBadgeBtn.click();
            }
        });

        blurRange.oninput = (e) => {
            const val = e.target.value + 'px';
            htmlElement.style.setProperty('--glass-blur', val);
            blurVal.textContent = val;
        };

        opacityRange.oninput = (e) => {
            const raw = e.target.value;
            const decimal = raw / 100;
            htmlElement.style.setProperty('--glass-opacity', decimal);
            opacityVal.textContent = raw + '%';
        };

        glowRange.oninput = (e) => {
            const raw = e.target.value;
            const decimal = raw / 100;
            htmlElement.style.setProperty('--glow-opacity', decimal);
            glowVal.textContent = raw + '%';
        };

        colorDots.forEach(dot => {
            dot.onclick = () => {
                colorDots.forEach(d => d.classList.remove('active'));
                dot.classList.add('active');
                document.body.setAttribute('data-color', dot.getAttribute('data-color'));
            };
        });

        const toggleFullscreen = () => {
            document.body.classList.toggle('fullscreen-mode');
            if (!document.body.classList.contains('fullscreen-mode')) {
                document.body.classList.remove('show-controls');
            }
            updateUI();
        };

        expandBtn.onclick = toggleFullscreen;
        minimizeBtn.onclick = toggleFullscreen;

        document.addEventListener('mousemove', (e) => {
            if (!document.body.classList.contains('fullscreen-mode')) return;

            const controlsMenu = document.getElementById('controlsColumn');
            const rect = controlsMenu.getBoundingClientRect();
            const isOverMenu = (
                e.clientX >= rect.left - 20 &&
                e.clientX <= rect.right + 20 &&
                e.clientY >= rect.top - 20 &&
                e.clientY <= rect.bottom + 20
            );

            if (isOverMenu) {
                clearTimeout(mouseTimer);
                return;
            }

            document.body.classList.add('show-controls');
            clearTimeout(mouseTimer);

            mouseTimer = setTimeout(() => {
                document.body.classList.remove('show-controls');
            }, 2000);
        });

        function startColorSampling() {
            if (sampleInterval) clearInterval(sampleInterval);
            sampleInterval = setInterval(() => {
                if (videoPlayer.paused || videoPlayer.ended) return;
                try {
                    ctx.drawImage(videoPlayer, 0, 0, 30, 30);
                    const frameData = ctx.getImageData(0, 0, 30, 30).data;
                    let r = 0, g = 0, b = 0, count = 0;
                    
                    for (let i = 0; i < frameData.length; i += 16) {
                        r += frameData[i];
                        g += frameData[i+1];
                        b += frameData[i+2];
                        count++;
                    }
                    
                    r = Math.floor(r / count);
                    g = Math.floor(g / count);
                    b = Math.floor(b / count);

                    ambientGlow.style.background = `rgb(${r}, ${g}, ${b})`;
                } catch (e) {}
            }, 600);
        }

        videoPlayer.onplay = () => {
            hasTriggeredConfetti = false;
            startColorSampling();
        };

        videoPlayer.onpause = () => {
            if (sampleInterval) clearInterval(sampleInterval);
        };

        videoPlayer.onended = () => {
            if (sampleInterval) clearInterval(sampleInterval);
            if (!videoPlayer.loop && !hasTriggeredConfetti) {
                hasTriggeredConfetti = true;
                confetti({
                    particleCount: 80,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }
        };

        loadUrlBtn.onclick = () => {
            const url = videoUrlInput.value.trim();
            if (url) {
                videoPlayer.src = url;
                activeSourceType = 'custom';
                hasTriggeredConfetti = false;
                updateUI();
                videoPlayer.load();
                videoPlayer.play().catch(() => {});
            }
        };

        localFileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                activeSourceType = 'local';
                hasTriggeredConfetti = false;
                videoTitle.textContent = file.name;
                videoPlayer.src = URL.createObjectURL(file);
                videoPlayer.load();
                videoPlayer.play();
            }
        };

        updateUI();
    </script>
