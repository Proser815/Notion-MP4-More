<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smooth Micro iOS Player</title>
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-base: transparent;
            --bg-surface: rgba(252, 248, 236, var(--glass-opacity, 0.85));
            --bg-hover: rgba(245, 238, 219, var(--glass-opacity, 0.85));
            --border-color: rgba(230, 210, 150, 0.4);
            --accent: #e5b83b;
            --accent-hover: #d4a72d;
            --text-main: #2c2c2e;
            --text-muted: #8e8e93;
            --radius: 14px;
            --shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
            --transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
            --glass-blur: 16px;
            --glass-opacity: 0.85;
            --glow-opacity: 0.15;
        }

        [data-theme="dark"] {
            --bg-base: transparent;
            --bg-surface: rgba(40, 37, 28, var(--glass-opacity, 0.85));
            --bg-hover: rgba(54, 50, 38, var(--glass-opacity, 0.85));
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #f5f5f7;
            --text-muted: #98989d;
            --shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
        }

        /* Preset Color Schemes: Light & Dark surface tints mapped dynamically */
        body[data-color="amber"] {
            --accent: #e5b83b; --accent-hover: #d4a72d;
            --bg-surface: rgba(252, 248, 236, var(--glass-opacity, 0.85));
            --bg-hover: rgba(245, 238, 219, var(--glass-opacity, 0.85));
            --border-color: rgba(230, 210, 150, 0.4);
        }
        [data-theme="dark"] body[data-color="amber"] {
            --bg-surface: rgba(38, 36, 26, var(--glass-opacity, 0.85));
            --bg-hover: rgba(50, 47, 34, var(--glass-opacity, 0.85));
            --border-color: rgba(229, 184, 59, 0.15);
        }

        body[data-color="sage"] {
            --accent: #7fa98b; --accent-hover: #6c9377;
            --bg-surface: rgba(240, 247, 242, var(--glass-opacity, 0.85));
            --bg-hover: rgba(228, 239, 231, var(--glass-opacity, 0.85));
            --border-color: rgba(160, 195, 170, 0.4);
        }
        [data-theme="dark"] body[data-color="sage"] {
            --bg-surface: rgba(28, 38, 31, var(--glass-opacity, 0.85));
            --bg-hover: rgba(36, 48, 40, var(--glass-opacity, 0.85));
            --border-color: rgba(127, 169, 139, 0.15);
        }

        body[data-color="rose"] {
            --accent: #d4838f; --accent-hover: #be717d;
            --bg-surface: rgba(252, 242, 244, var(--glass-opacity, 0.85));
            --bg-hover: rgba(247, 231, 234, var(--glass-opacity, 0.85));
            --border-color: rgba(225, 180, 188, 0.4);
        }
        [data-theme="dark"] body[data-color="rose"] {
            --bg-surface: rgba(42, 30, 33, var(--glass-opacity, 0.85));
            --bg-hover: rgba(54, 38, 42, var(--glass-opacity, 0.85));
            --border-color: rgba(212, 131, 143, 0.15);
        }

        body[data-color="lavender"] {
            --accent: #9d8ec4; --accent-hover: #8a7ab0;
            --bg-surface: rgba(246, 244, 250, var(--glass-opacity, 0.85));
            --bg-hover: rgba(238, 235, 245, var(--glass-opacity, 0.85));
            --border-color: rgba(195, 185, 220, 0.4);
        }
        [data-theme="dark"] body[data-color="lavender"] {
            --bg-surface: rgba(35, 32, 44, var(--glass-opacity, 0.85));
            --bg-hover: rgba(46, 42, 57, var(--glass-opacity, 0.85));
            --border-color: rgba(157, 142, 196, 0.15);
        }

        body[data-color="sky"] {
            --accent: #7ca9c9; --accent-hover: #6894b4;
            --bg-surface: rgba(242, 247, 251, var(--glass-opacity, 0.85));
            --bg-hover: rgba(231, 240, 247, var(--glass-opacity, 0.85));
            --border-color: rgba(170, 200, 220, 0.4);
        }
        [data-theme="dark"] body[data-color="sky"] {
            --bg-surface: rgba(28, 36, 43, var(--glass-opacity, 0.85));
            --bg-hover: rgba(36, 47, 56, var(--glass-opacity, 0.85));
            --border-color: rgba(124, 169, 201, 0.15);
        }

        body[data-color="peach"] {
            --accent: #e09f6e; --accent-hover: #cc8b5b;
            --bg-surface: rgba(253, 245, 240, var(--glass-opacity, 0.85));
            --bg-hover: rgba(249, 236, 228, var(--glass-opacity, 0.85));
            --border-color: rgba(230, 190, 165, 0.4);
        }
        [data-theme="dark"] body[data-color="peach"] {
            --bg-surface: rgba(43, 34, 28, var(--glass-opacity, 0.85));
            --bg-hover: rgba(56, 44, 36, var(--glass-opacity, 0.85));
            --border-color: rgba(224, 159, 110, 0.15);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            margin: 0;
            padding: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
            transition: background-color 0.5s ease;
        }

        /* Glass Surface Apply Dynamic Blur & Smooth Transitions */
        .control-card, .info-bar, .player-wrapper, .controls-column, select, .theme-btn, .cinematic-btn, .glass-toggle-btn, input[type="text"], .extra-tool-btn {
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1), background-color 0.4s ease, border-color 0.4s ease, color 0.4s ease, opacity 0.4s ease, filter 0.4s ease;
        }

        /* Cinematic Lights-Out Mode */
        body.cinematic-mode .controls-column {
            opacity: 0.2;
            filter: blur(5px);
            pointer-events: auto;
        }

        body.cinematic-mode .controls-column:hover {
            opacity: 1;
            filter: blur(0);
        }

        body.cinematic-mode .player-wrapper {
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15), 0 0 15px var(--accent);
        }

        .dashboard {
            width: 100%;
            max-width: 680px;
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 8px;
            align-items: stretch;
            transition: var(--transition);
        }

        .player-column {
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: relative;
        }

        .ambient-glow {
            position: absolute;
            inset: -2px;
            background: var(--accent);
            border-radius: calc(var(--radius) + 2px);
            filter: blur(14px);
            opacity: var(--glow-opacity);
            z-index: -1;
            transition: background 0.6s ease, opacity 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            pointer-events: none;
        }

        .controls-column {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2px;
        }

        h1 {
            font-size: 12px;
            font-weight: 600;
            margin: 0;
            letter-spacing: -0.2px;
            transition: color 0.4s ease;
        }

        .header-controls {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        select, .theme-btn, .cinematic-btn, .glass-toggle-btn {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 9px;
            font-weight: 500;
            cursor: pointer;
            outline: none;
        }

        select:hover, .theme-btn:hover, .cinematic-btn:hover, .glass-toggle-btn:hover {
            background: var(--bg-hover);
            transform: scale(1.02);
        }

        .cinematic-btn.active, .glass-toggle-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        /* Glass settings popover drawer */
        .glass-settings-panel {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-shadow: var(--shadow);
            font-size: 9px;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            margin: 0;
            border-width: 0;
            transition: max-height 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.3s ease, padding 0.4s ease, margin 0.4s ease, border-width 0.4s ease;
        }

        .glass-settings-panel.open {
            max-height: 260px;
            opacity: 1;
            padding: 8px;
            margin-bottom: 2px;
            border-width: 1px;
        }

        .slider-row {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .slider-row label {
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
            font-weight: 500;
            transition: color 0.4s ease;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .color-picker-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 4px;
            padding-top: 2px;
        }

        .color-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            cursor: pointer;
            border: 1px solid var(--border-color);
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .color-dot:hover {
            transform: scale(1.2);
        }

        .color-dot.active {
            transform: scale(1.25);
            box-shadow: 0 0 0 2px var(--bg-surface), 0 0 0 4px var(--accent);
        }

        /* Extra Tools Row (Loop & Boost inside settings) */
        .settings-extra-row {
            display: flex;
            gap: 4px;
            padding-top: 2px;
        }

        .extra-tool-btn {
            flex: 1;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 4px 6px;
            border-radius: 8px;
            font-size: 9px;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
        }

        .extra-tool-btn:hover {
            background: var(--bg-hover);
            color: var(--text-main);
        }

        .extra-tool-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .info-bar {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 4px 10px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            white-space: nowrap;
            overflow: hidden;
        }

        .info-text {
            font-size: 9px;
            color: var(--text-muted);
            margin: 0;
            text-overflow: ellipsis;
            overflow: hidden;
            width: 100%;
            transition: color 0.4s ease;
        }

        .control-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-shadow: var(--shadow);
        }

        .control-row {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        input[type="text"] {
            flex: 1;
            min-width: 0;
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid transparent;
            color: var(--text-main);
            padding: 5px 8px;
            border-radius: 10px;
            font-size: 9px;
            outline: none;
        }

        [data-theme="dark"] input[type="text"] {
            background: rgba(0, 0, 0, 0.2);
        }

        input[type="text"]:focus {
            background: var(--bg-surface);
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(229, 184, 59, 0.2);
        }

        .action-btn, .file-label {
            background: var(--accent);
            color: #ffffff;
            border: none;
            padding: 5px 10px;
            border-radius: 10px;
            font-weight: 500;
            cursor: pointer;
            font-size: 9px;
            white-space: nowrap;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .action-btn:hover, .file-label:hover {
            background: var(--accent-hover);
            transform: translateY(-0.5px);
        }

        .action-btn:active, .file-label:active {
            transform: scale(0.96);
        }

        input[type="file"] {
            display: none;
        }

        .player-wrapper {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow);
            position: relative;
        }

        video {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            outline: none;
        }

        .video-info {
            padding: 6px 10px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border-color 0.4s ease;
        }

        .video-title {
            font-size: 9px;
            font-weight: 500;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            transition: color 0.4s ease;
        }

        .fullscreen-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 9px;
            font-weight: 500;
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .fullscreen-btn:hover {
            background: var(--bg-hover);
            color: var(--text-main);
        }

        /* Full Webpage / Expand Mode */
        body.fullscreen-mode {
            padding: 0;
            background-color: #000;
        }

        body.fullscreen-mode .dashboard {
            display: flex;
            max-width: 100vw;
            height: 100vh;
            width: 100vw;
            gap: 0;
            position: relative;
        }

        body.fullscreen-mode .player-column {
            width: 100vw;
            height: 100vh;
        }

        body.fullscreen-mode .player-wrapper {
            border: none;
            border-radius: 0;
            box-shadow: none;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        body.fullscreen-mode video {
            width: 100vw;
            height: 100vh;
            aspect-ratio: unset;
            object-fit: contain;
            border-radius: 0;
            border: none;
            background: #000;
        }

        body.fullscreen-mode .ambient-glow {
            opacity: calc(var(--glow-opacity) * 0.5);
        }

        /* Smaller Hover Overlay Menu on the Right in Fullscreen */
        body.fullscreen-mode .controls-column {
            position: fixed;
            top: 16px;
            right: 16px;
            width: 250px;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transform: translateX(15px);
            transition: opacity 0.4s cubic-bezier(0.25, 1, 0.5, 1), transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), filter 0.4s ease;
        }

        body.fullscreen-mode .player-wrapper .video-info {
            display: none;
        }

        body.fullscreen-mode.show-controls .controls-column {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(0);
        }

        @media (max-width: 540px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
            body.fullscreen-mode .controls-column {
                width: calc(100vw - 32px);
                right: 16px;
            }
        }
    </style>
</head>
<body data-color="amber">

    <div class="dashboard">
        <!-- Left Column: Player -->
        <div class="player-column" id="playerColumn">
            <div class="ambient-glow" id="ambientGlow"></div>
            <div class="player-wrapper" id="playerWrapper">
                <video id="mainVideoPlayer" crossorigin="anonymous" controls playsinline></video>
                <div class="video-info">
                    <div class="video-title" id="currentVideoTitle">No video</div>
                    <button class="fullscreen-btn" id="expandBtn">Expand</button>
                </div>
            </div>
        </div>

        <!-- Right Column: Controls, Settings & Info -->
        <div class="controls-column" id="controlsColumn">
            <div class="header-row">
                <h1 id="appTitle">Player</h1>
                <div class="header-controls">
                    <button class="glass-toggle-btn" id="glassToggleBtn" title="Glass Settings">🪟</button>
                    <button class="cinematic-btn" id="cinematicToggleBtn" title="Theater Mode">✨</button>
                    <select id="langSelect" aria-label="Language">
                        <option value="en">EN</option>
                        <option value="zh">中</option>
                        <option value="ja">日</option>
                        <option value="de">DE</option>
                        <option value="ko">한</option>
                        <option value="fr">FR</option>
                        <option value="it">IT</option>
                        <option value="fa">فا</option>
                    </select>
                    <button class="theme-btn" id="themeToggleBtn">Theme</button>
                    <button class="fullscreen-btn" id="minimizeBtn" style="font-weight: 600; padding: 3px 6px;">✕</button>
                </div>
            </div>

            <!-- Glass, Glow, Color Scheme & Loop/Boost Customizer Panel -->
            <div class="glass-settings-panel" id="glassSettingsPanel">
                <div class="slider-row">
                    <label>Blur Intensity <span id="blurVal">16px</span></label>
                    <input type="range" id="blurRange" min="0" max="40" value="16">
                </div>
                <div class="slider-row">
                    <label>Glass Opacity <span id="opacityVal">85%</span></label>
                    <input type="range" id="opacityRange" min="10" max="100" value="85">
                </div>
                <div class="slider-row">
                    <label>Ambient Glow <span id="glowVal">15%</span></label>
                    <input type="range" id="glowRange" min="0" max="100" value="15">
                </div>
                <div class="settings-extra-row">
                    <button class="extra-tool-btn" id="loopToggleBtn">🔁 Loop: Off</button>
                    <button class="extra-tool-btn" id="boostToggleBtn">🔊 Boost: Off</button>
                </div>
                <div class="color-picker-row" id="colorPickerRow">
                    <div class="color-dot active" data-color="amber" style="background: #e5b83b;" title="Amber"></div>
                    <div class="color-dot" data-color="sage" style="background: #7fa98b;" title="Sage"></div>
                    <div class="color-dot" data-color="rose" style="background: #d4838f;" title="Rose"></div>
                    <div class="color-dot" data-color="lavender" style="background: #9d8ec4;" title="Lavender"></div>
                    <div class="color-dot" data-color="sky" style="background: #7ca9c9;" title="Sky"></div>
                    <div class="color-dot" data-color="peach" style="background: #e09f6e;" title="Peach"></div>
                </div>
            </div>

            <div class="control-card">
                <div class="control-row">
                    <input type="text" id="videoUrlInput" placeholder="URL (.mp4/.webm)..." />
                    <button class="action-btn" id="loadUrlBtn">Load</button>
                </div>
                <div class="control-row">
                    <label class="file-label" id="labelBrowse" style="width: 100%;">
                        Choose Local File
                        <input type="file" id="localFileInput" accept="video/*">
                    </label>
                </div>
            </div>

            <div class="info-bar">
                <p class="info-text" id="infoDesc">Paste direct video link or pick a local device file.</p>
            </div>
        </div>
    </div>

    <!-- Hidden canvas for sampling video frame colors -->
    <canvas id="colorSamplerCanvas" style="display:none;" width="30" height="30"></canvas>

    <script>
        const videoPlayer = document.getElementById('mainVideoPlayer');
        const videoTitle = document.getElementById('currentVideoTitle');
        const videoUrlInput = document.getElementById('videoUrlInput');
        const loadUrlBtn = document.getElementById('loadUrlBtn');
        const localFileInput = document.getElementById('localFileInput');
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const cinematicToggleBtn = document.getElementById('cinematicToggleBtn');
        const glassToggleBtn = document.getElementById('glassToggleBtn');
        const glassSettingsPanel = document.getElementById('glassSettingsPanel');
        const blurRange = document.getElementById('blurRange');
        const opacityRange = document.getElementById('opacityRange');
        const glowRange = document.getElementById('glowRange');
        const blurVal = document.getElementById('blurVal');
        const opacityVal = document.getElementById('opacityVal');
        const glowVal = document.getElementById('glowVal');
        const langSelect = document.getElementById('langSelect');
        const expandBtn = document.getElementById('expandBtn');
        const minimizeBtn = document.getElementById('minimizeBtn');
        const ambientGlow = document.getElementById('ambientGlow');
        const colorDots = document.querySelectorAll('.color-dot');
        const colorCanvas = document.getElementById('colorSamplerCanvas');
        const ctx = colorCanvas.getContext('2d');
        const htmlElement = document.documentElement;

        const loopToggleBtn = document.getElementById('loopToggleBtn');
        const boostToggleBtn = document.getElementById('boostToggleBtn');

        let activeSourceType = 'none';
        let mouseTimer = null;
        let sampleInterval = null;
        let hasTriggeredConfetti = false;
        let audioCtx = null;
        let analyser = null;
        let sourceNode = null;
        let gainNode = null;
        let isAudioSetup = false;

        const translations = {
            en: { title: "Player", desc: "Paste direct video link or pick a local device file.", load: "Load", file: "Choose Local File", none: "No video", custom: "Stream", expand: "Expand" },
            zh: { title: "播放器", desc: "粘贴直接视频链接或选择本地文件。", load: "加载", file: "选择本地文件", none: "无视频", custom: "流", expand: "全屏" },
            ja: { title: "プレーヤー", desc: "直接リンクを貼り付けるかファイルを選択。", load: "読込", file: "ファイル選択", none: "動画なし", custom: "ストリーム", expand: "拡大" },
            de: { title: "Player", desc: "Direkten Link einfügen oder lokale Datei wählen.", load: "Laden", file: "Datei wählen", none: "Kein Video", custom: "Stream", expand: "Vollbild" },
            ko: { title: "플레이어", desc: "비디오 링크를 붙여넣거나 로컬 파일을 선택.", load: "로드", file: "로컬 파일 선택", none: "비디오 없음", custom: "스트림", expand: "확대" },
            fr: { title: "Lecteur", desc: "Collez un lien direct ou choisissez un fichier.", load: "Charger", file: "Choisir un fichier", none: "Aucune vidéo", custom: "Flux", expand: "Agrandir" },
            it: { title: "Player", desc: "Incolla un link o seleziona un file.", load: "Carica", file: "Scegli file", none: "Nessun video", custom: "Flusso", expand: "Espandi" },
            fa: { title: "پخش کننده", desc: "لینک مستقیم را وارد کنید یا فایل انتخاب کنید.", load: "بارگذاری", file: "انتخاب فایل", none: "ویدیویی نیست", custom: "جریان", expand: "بزرگ" }
        };

        function updateUI() {
            const lang = langSelect.value;
            const t = translations[lang] || translations.en;
            
            document.getElementById('appTitle').textContent = t.title;
            document.getElementById('infoDesc').textContent = t.desc;
            loadUrlBtn.textContent = t.load;
            document.getElementById('labelBrowse').childNodes[0].nodeValue = t.file + " ";
            expandBtn.textContent = t.expand;

            if (activeSourceType === 'none') videoTitle.textContent = t.none;
            else if (activeSourceType === 'custom') videoTitle.textContent = t.custom;
        }

        langSelect.onchange = updateUI;
        themeToggleBtn.onclick = () => {
            htmlElement.setAttribute('data-theme', htmlElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
        };

        cinematicToggleBtn.onclick = () => {
            document.body.classList.toggle('cinematic-mode');
            cinematicToggleBtn.classList.toggle('active');
        };

        glassToggleBtn.onclick = () => {
            glassSettingsPanel.classList.toggle('open');
            glassToggleBtn.classList.toggle('active');
        };

        blurRange.oninput = (e) => {
            const val = e.target.value + 'px';
            htmlElement.style.setProperty('--glass-blur', val);
            blurVal.textContent = val;
        };

        opacityRange.oninput = (e) => {
            const raw = e.target.value;
            const decimal = raw / 100;
            htmlElement.style.setProperty('--glass-opacity', decimal);
            opacityVal.textContent = raw + '%';
        };

        glowRange.oninput = (e) => {
            const raw = e.target.value;
            const decimal = raw / 100;
            htmlElement.style.setProperty('--glow-opacity', decimal);
            glowVal.textContent = raw + '%';
        };

        colorDots.forEach(dot => {
            dot.onclick = () => {
                colorDots.forEach(d => d.classList.remove('active'));
                dot.classList.add('active');
                document.body.setAttribute('data-color', dot.getAttribute('data-color'));
            };
        });

        // Loop Toggle Feature (inside settings drawer)
        loopToggleBtn.onclick = () => {
            videoPlayer.loop = !videoPlayer.loop;
            if (videoPlayer.loop) {
                loopToggleBtn.classList.add('active');
                loopToggleBtn.textContent = "🔁 Loop: On";
            } else {
                loopToggleBtn.classList.remove('active');
                loopToggleBtn.textContent = "🔁 Loop: Off";
            }
        };

        // Volume Boost Toggle Feature (inside settings drawer)
        boostToggleBtn.onclick = () => {
            setupAudioContext();
            if (gainNode) {
                if (gainNode.gain.value === 1.0) {
                    gainNode.gain.value = 2.5; // Boost volume 2.5x
                    boostToggleBtn.classList.add('active');
                    boostToggleBtn.textContent = "🔊 Boost: 2.5x";
                } else {
                    gainNode.gain.value = 1.0;
                    boostToggleBtn.classList.remove('active');
                    boostToggleBtn.textContent = "🔊 Boost: Off";
                }
            }
        };

        const toggleFullscreen = () => {
            document.body.classList.toggle('fullscreen-mode');
            if (!document.body.classList.contains('fullscreen-mode')) {
                document.body.classList.remove('show-controls');
            }
            updateUI();
        };

        expandBtn.onclick = toggleFullscreen;
        minimizeBtn.onclick = toggleFullscreen;

        document.addEventListener('mousemove', (e) => {
            if (!document.body.classList.contains('fullscreen-mode')) return;

            const controlsMenu = document.getElementById('controlsColumn');
            const rect = controlsMenu.getBoundingClientRect();
            const isOverMenu = (
                e.clientX >= rect.left - 20 &&
                e.clientX <= rect.right + 20 &&
                e.clientY >= rect.top - 20 &&
                e.clientY <= rect.bottom + 20
            );

            if (isOverMenu) {
                clearTimeout(mouseTimer);
                return;
            }

            document.body.classList.add('show-controls');
            clearTimeout(mouseTimer);

            mouseTimer = setTimeout(() => {
                document.body.classList.remove('show-controls');
            }, 2000);
        });

        // Setup Web Audio API for Volume Boost
        function setupAudioContext() {
            if (isAudioSetup) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                
                sourceNode = audioCtx.createMediaElementSource(videoPlayer);
                gainNode = audioCtx.createGain();
                gainNode.gain.value = 1.0;

                sourceNode.connect(gainNode);
                gainNode.connect(analyser);
                analyser.connect(audioCtx.destination);
                
                isAudioSetup = true;
            } catch (e) {
                // AudioContext fallback for restricted cross-origin policies
            }
        }

        // Sample dominant color with minimal footprint
        function startColorSampling() {
            if (sampleInterval) clearInterval(sampleInterval);
            sampleInterval = setInterval(() => {
                if (videoPlayer.paused || videoPlayer.ended) return;
                try {
                    ctx.drawImage(videoPlayer, 0, 0, 30, 30);
                    const frameData = ctx.getImageData(0, 0, 30, 30).data;
                    let r = 0, g = 0, b = 0, count = 0;
                    
                    for (let i = 0; i < frameData.length; i += 16) {
                        r += frameData[i];
                        g += frameData[i+1];
                        b += frameData[i+2];
                        count++;
                    }
                    
                    r = Math.floor(r / count);
                    g = Math.floor(g / count);
                    b = Math.floor(b / count);

                    ambientGlow.style.background = `rgb(${r}, ${g}, ${b})`;
                } catch (e) {
                    // CORS fallback safely handled
                }
            }, 600);
        }

        videoPlayer.onplay = () => {
            hasTriggeredConfetti = false;
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            setupAudioContext();
            startColorSampling();
        };

        videoPlayer.onpause = () => {
            if (sampleInterval) clearInterval(sampleInterval);
        };

        videoPlayer.onended = () => {
            if (sampleInterval) clearInterval(sampleInterval);
            if (!videoPlayer.loop && !hasTriggeredConfetti) {
                hasTriggeredConfetti = true;
                confetti({
                    particleCount: 80,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }
        };

        loadUrlBtn.onclick = () => {
            const url = videoUrlInput.value.trim();
            if (url) {
                videoPlayer.src = url;
                activeSourceType = 'custom';
                hasTriggeredConfetti = false;
                updateUI();
                videoPlayer.load();
                videoPlayer.play().catch(() => {});
            }
        };

        localFileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                activeSourceType = 'local';
                hasTriggeredConfetti = false;
                videoTitle.textContent = file.name;
                videoPlayer.src = URL.createObjectURL(file);
                videoPlayer.load();
                videoPlayer.play();
            }
        };
    </script>
</body>
</html>
